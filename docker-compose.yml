version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: auction-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - auction-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_HOSTNAME=eureka-server
    networks:
      - auction-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - auction-network

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL:-jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER:-auth_user}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD:-auth_pass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - auction-network

  auction-service:
    build:
      context: ./auction-service
    container_name: auction-service
    ports:
      - "${AUCTION_PORT:-8082}:8082"
    environment:
      - SPRING_DATASOURCE_URL=${AUCTION_DB_URL:-jdbc:mysql://mysql:3306/auction_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${AUCTION_DB_USER:-auction_user}
      - SPRING_DATASOURCE_PASSWORD=${AUCTION_DB_PASSWORD:-auction_pass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - auction-network

  bidding-service:
    build:
      context: ./bidding-service
    container_name: bidding-service
    ports:
      - "${BIDDING_PORT:-8083}:8083"
    environment:
      - SPRING_DATASOURCE_URL=${BIDDING_DB_URL:-jdbc:mysql://mysql:3306/bidding_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${BIDDING_DB_USER:-bidding_user}
      - SPRING_DATASOURCE_PASSWORD=${BIDDING_DB_PASSWORD:-bidding_pass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - auction-network

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "${PAYMENT_PORT:-8084}:8084"
    environment:
      - SPRING_DATASOURCE_URL=${PAYMENT_DB_URL:-jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${PAYMENT_DB_USER:-payment_user}
      - SPRING_DATASOURCE_PASSWORD=${PAYMENT_DB_PASSWORD:-payment_pass}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URI:-http://eureka-server:8761/eureka/}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - PLATFORM_FEE_PERCENTAGE=${PLATFORM_FEE_PERCENTAGE:-0.05}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - auction-network

volumes:
  mysql-data:

networks:
  auction-network:
    driver: bridge
